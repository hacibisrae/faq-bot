apiVersion: apps/v1
kind: Deployment
metadata:
  name: faq-bot
  labels:
    app: faq-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faq-bot
  template:
    metadata:
      labels:
        app: faq-bot
    spec:
      containers:
        - name: faq-bot
          image: ghcr.io/hacibisrae/faq-bot:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi