name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint avec flake8
        run: flake8 .

      - name: Tests avec pytest
        run: pytest -v
        
  docker:
    name: Build et test de l'image Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t faq-bot:test .

      - name: Lancer le conteneur
        run: docker run -d --name faq-bot -p 5000:5000 faq-bot:test

      - name: Vérifier que l'application répond
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
          curl --fail -X POST http://localhost:5000/chat -H "Content-Type: application/json" -d '{"message": "docker"}'

      - name: Afficher les logs du conteneur
        if: always()
        run: docker logs faq-bot    

  publish:
    name: Publication de l'image sur ghcr.io
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/faq-bot

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image
        run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: Publier l'image
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}      
  deploy:
    name: Déploiement sur Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/faq-bot

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Créer un cluster Kubernetes avec kind
        uses: helm/kind-action@v1
        with:
          cluster_name: faq-bot

      - name: Vérifier le cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Déployer l'application
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/faq-bot faq-bot=$IMAGE:${{ github.sha }}

      - name: Attendre que le déploiement soit prêt
        run: kubectl rollout status deployment/faq-bot --timeout=120s

      - name: Afficher les ressources
        run: kubectl get deployments,pods,services -o wide

      - name: Tester l'application déployée
        run: |
          kubectl port-forward service/faq-bot 8080:80 &
          sleep 5
          curl --fail http://localhost:8080/health
          curl --fail -X POST http://localhost:8080/chat -H "Content-Type: application/json" -d '{"message": "kubernetes"}'

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl describe pods -l app=faq-bot
          kubectl logs -l app=faq-bot --tail=50              