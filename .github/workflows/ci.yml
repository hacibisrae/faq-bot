name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint avec flake8
        run: flake8 .

      - name: Tests avec pytest
        run: pytest -v
        
  docker:
    name: Build et test de l'image Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t faq-bot:test .

      - name: Lancer le conteneur
        run: docker run -d --name faq-bot -p 5000:5000 faq-bot:test

      - name: Vérifier que l'application répond
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
          curl --fail -X POST http://localhost:5000/chat -H "Content-Type: application/json" -d '{"message": "docker"}'

      - name: Afficher les logs du conteneur
        if: always()
        run: docker logs faq-bot      